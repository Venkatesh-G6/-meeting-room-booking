server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/roombooking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-single-value-as-array: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
  # Modern Spring Cloud Azure 5.x — compatible with Spring Boot 3.x
  # Never hardcode secrets here.
  # All sensitive values must come from
  # environment variables or a secrets manager.
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:dummy-tenant-id}
        credential:
          client-id: ${AZURE_CLIENT_ID:dummy-client-id}
          client-secret: ${AZURE_CLIENT_SECRET:dummy-client-secret}
        app-id-uri: ${AZURE_APP_ID_URI:api://dummy}
        user-group:
          allowed-group-names:
            - RoomBooking-Employees
            - RoomBooking-Admins
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:dummy-tenant-id}/v2.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Teams Bot credentials
# BOT_APP_ID and BOT_APP_PASSWORD
# come from Azure Bot Service registration
# Phase 9: Register bot at
# portal.azure.com → Azure Bot Service
bot:
  app-id: ${BOT_APP_ID:dev-bot-id}
  app-password: ${BOT_APP_PASSWORD:dev-bot-password}
  name: RoomBookingBot

logging:
  level:
    com.yourcompany.roombooking: DEBUG
