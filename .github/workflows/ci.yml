name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: ./server
        run: |
          mvn clean test \
            -Dspring.profiles.active=dev \
            -B

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: server/target/surefire-reports/*.xml
          reporter: java-junit

  backend-build:
    name: Backend Build
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: ./server
        run: mvn clean package -DskipTests -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: server/target/*.jar

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/room-booking-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./client/room-booking-ui
        run: npm ci

      - name: TypeScript check
        working-directory: ./client/room-booking-ui
        run: npm run typecheck

      - name: ESLint check
        working-directory: ./client/room-booking-ui
        run: npm run lint

      - name: Build
        working-directory: ./client/room-booking-ui
        run: npm run build
        env:
          VITE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/room-booking-ui/dist/

  docker-build:
    name: Docker Build
    needs: [backend-build, frontend-checks]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build
        env:
          DB_PASSWORD: test-password
